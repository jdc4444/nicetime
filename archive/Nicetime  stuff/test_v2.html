<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test Globe</title></head>
<body style="margin:0">
<div id="g" style="width:100vw;height:100vh"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.31.1/dist/globe.gl.min.js"></script>
<script>
var pts = [
  {lat:40.7, lng:-74.0},
  {lat:51.5, lng:-0.1},
  {lat:35.7, lng:139.7},
  {lat:-33.9, lng:18.4},
  {lat:28.6, lng:77.2}
];
var g = Globe()
  .backgroundColor('#ffffff')
  .pointsData(pts)
  .pointLat('lat').pointLng('lng')
  .pointColor(function(){return 'red'})
  .pointRadius(0.5)
  (document.getElementById('g'));
var m = g.globeMaterial();
m.color = new THREE.Color('#f0f0f3');
m.emissive = new THREE.Color('#f0f0f3');
m.emissiveIntensity = 0.1;
console.log('Globe created OK');
</script>
</body></html>
