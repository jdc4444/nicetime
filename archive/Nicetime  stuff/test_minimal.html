<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test</title></head>
<body style="margin:0">
<div id="g" style="width:100vw;height:100vh"></div>
<script src="https://unpkg.com/three"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script>
var pts = [
  {lat:40.7, lng:-74.0, city:"New York"},
  {lat:51.5, lng:-0.1, city:"London"},
  {lat:35.7, lng:139.7, city:"Tokyo"},
  {lat:-33.9, lng:18.4, city:"Cape Town"},
  {lat:28.6, lng:77.2, city:"Delhi"}
];
var g = Globe()
  .backgroundColor('#ffffff')
  .pointsData(pts)
  .pointLat('lat').pointLng('lng')
  .pointColor(function(){return 'red'})
  .pointRadius(0.5)
  (document.getElementById('g'));
var m = g.globeMaterial();
m.color = new THREE.Color('#f0f0f3');
m.emissive = new THREE.Color('#f0f0f3');
m.emissiveIntensity = 0.1;
</script>
</body></html>
